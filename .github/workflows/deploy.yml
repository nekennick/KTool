name: Deploy KTool to Vietnix Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút chạy thủ công từ giao diện GitHub khi cần

jobs:
  web-deploy:
    name: 🚀 Sync files to Vietnix via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Sync ktool files to Vietnix hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./ktool/
          server-dir: ./
          dangerous-clean-slate: false
