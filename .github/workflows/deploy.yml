name: Deploy KTool to Vietnix Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-deploy:
    name: 🚀 Deploy KTool via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Install basic-ftp
        run: npm install basic-ftp

      - name: 🚀 Run FTP Deploy Script
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node deploy_ftp.js

      - name: 📝 Commit Deploy Log
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy_result.md || true
          git commit -m "docs: auto-save deploy log [skip ci]" || true
          git push || true
